          "@type": "ClothingStore",
          "@id": "https://rawbyzifat.netlify.app/#store",

          }

        {
          "@type": "WebSite",
          "@id": "https://rawbyzifat.netlify.app/#website",

          "name": "RAW BY ZIFAT",
          "alternateName": "Raw by fashion",

          },

    <script>
      window.addEventListener('error', function(e) {
        if (e && (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client')) || (e.filename && e.filename.includes('@vite/client')))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
