<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e5e5e5" />
      <stop offset="100%" stop-color="#a3a3a3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle architectural border ring -->
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.45" />
  <rect x="32" y="32" width="448" height="448" rx="76" fill="none" stroke="#262626" stroke-width="1.5" />

  <!-- Corner aesthetic accents -->
  <path d="M 52 90 L 52 52 L 90 52" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 460 90 L 460 52 L 422 52" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 52 422 L 52 460 L 90 460" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 460 422 L 460 460 L 422 460" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Badge Top Label -->
  <text x="256" y="112" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="9" fill="url(#goldGrad)" text-anchor="middle">
    HAUTE STREETWEAR
  </text>

  <!-- Main RAW Icon / Monogram -->
  <g transform="translate(0, 5)">
    <!-- Main Bold RAW text -->
    <text x="256" y="285" font-family="'Space Grotesk', 'Plus Jakarta Sans', -apple-system, sans-serif" font-size="168" font-weight="900" letter-spacing="14" fill="url(#silverGrad)" text-anchor="middle">
      RAW
    </text>

    <!-- Underline gold streak bar -->
    <rect x="136" y="312" width="240" height="7" rx="3.5" fill="url(#goldGrad)" />
    <circle cx="256" cy="315.5" r="5.5" fill="#fef08a" />
  </g>

  <!-- Subtitle: BY ZIFAT -->
  <text x="256" y="375" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="12" fill="#ffffff" text-anchor="middle">
    BY ZIFAT
  </text>

  <!-- Bottom micro-tag -->
  <text x="256" y="425" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#737373" text-anchor="middle">
    DHAKA • BANGLADESH
  </text>
</svg>
